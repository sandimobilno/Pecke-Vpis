<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vpis obiska - Pečke</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 400px; margin: 20px auto; padding: 15px; text-align: center; color: #333; }
    .card { background: #f9f9f9; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 12px; margin: 6px 0; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .btn { width: 90%; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: bold; color: white; background-color: #cccccc; border: none; border-radius: 6px; cursor: not-allowed; transition: 0.2s; }
    .btn.active { background-color: #28a745; cursor: pointer; }
    
    /* Slog za gumb Lestvica */
    .btn-secondary { display: block; width: 90%; margin: 15px auto 0 auto; padding: 12px; font-size: 15px; font-weight: bold; color: #0066cc; background-color: #ffffff; border: 2px solid #0066cc; border-radius: 6px; text-decoration: none; box-sizing: border-box; transition: 0.2s; }
    .btn-secondary:hover { background-color: #e6f0fa; }

    #status { margin-top: 15px; font-size: 14px; font-weight: 600; min-height: 20px; }
    .edit-link { display: inline-block; margin-top: 12px; font-size: 12px; color: #0066cc; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Vpis obiska</h2>
    
    <input type="text" id="ime" placeholder="Ime" required>
    <input type="text" id="priimek" placeholder="Priimek" required>
    <input type="email" id="email" placeholder="E-poštni naslov" required>
    
    <button id="vpisBtn" class="btn" disabled onclick="oddajVpis()">PREVERJANJE LOKACIJE...</button>
    
    <!-- Gumb za ogled lestvice -->
    <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pubhtml?gid=1188154452&single=true" target="_blank" class="btn-secondary">LESTVICA</a>

    <div id="status">Pridobivanje GPS lokacije...</div>
    <span class="edit-link" id="resetBtn" style="display:none;" onclick="pobrisiPodatke()">Spremeni moje podatke</span>
  </div>

  <script>
    // --- ENOTNE TOČNE KOORDINATE IN RADIJ ---
    const TARGET_LAT = 46.52271285660147;
    const TARGET_LNG = 15.54089586436217;
    const MAX_RADIUS_METERS = 50;

    let userLat = null;
    let userLng = null;
    let isLocationValid = false; // Zastavica, ki potrjuje veljavnost lokacije

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    window.onload = function() {
      const sIme = localStorage.getItem("vpis_ime");
      const sPriimek = localStorage.getItem("vpis_priimek");
      const sEmail = localStorage.getItem("vpis_email");

      if (sIme && sPriimek && sEmail) {
        document.getElementById("ime").value = sIme;
        document.getElementById("priimek").value = sPriimek;
        document.getElementById("email").value = sEmail;
        document.getElementById("resetBtn").style.display = "inline-block";
      }

      preveriGps();
    };

    function preveriGps() {
      const btn = document.getElementById("vpisBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.classList.remove("active");
      btn.innerText = "PREVERJANJE LOKACIJE...";
      isLocationValid = false;

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            const dist = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

            if (dist <= MAX_RADIUS_METERS) {
              btn.disabled = false;
              btn.classList.add("active");
              btn.innerText = "POTRDI VPIS";
              status.style.color = "green";
              status.innerText = `Ste na lokaciji (oddaljenost: ${dist} m).`;
              isLocationValid = true;
            } else {
              btn.disabled = true;
              btn.classList.remove("active");
              btn.innerText = "VPIS NI OMOGOČEN";
              status.style.color = "red";
              status.innerText = `Ste zunaj območja (${dist} m od točke, max ${MAX_RADIUS_METERS} m).`;
              isLocationValid = false;
            }
          },
          (err) => {
            userLat = null;
            userLng = null;
            isLocationValid = false;
            btn.disabled = true;
            btn.classList.remove("active");
            btn.innerText = "VPIS NI OMOGOČEN";
            status.style.color = "red";
            status.innerText = "Za vpis morate vklopiti GPS in dovoliti dostop do lokacije.";
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 }
        );
      } else {
        btn.disabled = true;
        btn.classList.remove("active");
        status.innerText = "Vaš brskalnik ne podpira geolokacije.";
        isLocationValid = false;
      }
    }

    function oddajVpis() {
      // Preverimo, ali je bila lokacija uspešno potrjena ob nalaganju
      if (!isLocationValid || userLat === null || userLng === null) {
        alert("Vpis ni mogoč! Vaša lokacija se ne ujema z nastavljenimi koordinatami ali pa ste zunaj dovoljenega območja.");
        return;
      }

      const ime = document.getElementById("ime").value.trim();
      const priimek = document.getElementById("priimek").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();

      if (!ime || !priimek || !email) {
        alert("Prosimo, izpolnite vsa polja!");
        return;
      }

      if (!validateEmail(email)) {
        alert("Prosimo, vnesite veljaven e-poštni naslov!");
        return;
      }

      const btn = document.getElementById("vpisBtn");
      btn.disabled = true;
      btn.innerText = "POŠILJANJE...";

      localStorage.setItem("vpis_ime", ime);
      localStorage.setItem("vpis_priimek", priimek);
      localStorage.setItem("vpis_email", email);

      const razdalja = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

      // Zaokrožitev koordinat na 4 decimalna mesta
      const latFormatted = Number(userLat).toFixed(4);
      const lngFormatted = Number(userLng).toFixed(4);

      const baseUrl = "https://script.google.com/macros/s/AKfycbxsWJWNSL_119EsMiIOmPV5Fsl1nDgxiyBve9wi6qaMspEPWCelUJS4ZG7acvagHKLK4A/exec";
      const fullUrl = `${baseUrl}?ime=${encodeURIComponent(ime)}&priimek=${encodeURIComponent(priimek)}&email=${encodeURIComponent(email)}&lat=${encodeURIComponent(latFormatted)}&lng=${encodeURIComponent(lngFormatted)}&razdalja=${encodeURIComponent(razdalja)}`;

      window.location.href = fullUrl;
    }

    function pobrisiPodatke() {
      if (confirm("Želite izbrisati shranjene podatke s tega telefona?")) {
        localStorage.removeItem("vpis_ime");
        localStorage.removeItem("vpis_priimek");
        localStorage.removeItem("vpis_email");
        document.getElementById("ime").value = "";
        document.getElementById("priimek").value = "";
        document.getElementById("email").value = "";
        document.getElementById("resetBtn").style.display = "none";
      }
    }
  </script>
</body>
</html>
