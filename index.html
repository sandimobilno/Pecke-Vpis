<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vpisna knjiga - Pečke</title>
  <style>
    :root {
      --primary-color: #2c5e3b;
      --primary-hover: #1e3f27;
      --bg-color: #f4f7f5;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
      --error-color: #d9534f;
      --success-color: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px;
      width: 100%;
      max-width: 450px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--primary-color);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-option {
      flex: 1;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 10px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: normal;
      transition: all 0.2s;
    }

    .radio-option input:checked + label {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    #status-box {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-info {
      background-color: #e8f4f8;
      color: #1d6f8a;
      border: 1px solid #bce8f1;
    }

    .status-error {
      background-color: #fff3f3;
      color: #dc3545;
      border: 1px solid #ffcdd2;
    }

    .status-success {
      background-color: #dff0d8;
      color: #28a745;
      border: 1px solid #d6e9c6;
    }

    button, .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    button:hover, .btn:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    .success-card {
      text-align: center;
      padding: 10px 0;
    }
    .success-card .icon {
      font-size: 50px;
      color: var(--success-color);
      margin-bottom: 10px;
    }
    .success-card h2 {
      color: var(--success-color);
      margin-bottom: 15px;
    }
    .success-card p {
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    iframe#hidden_iframe {
      display: none;
    }
  </style>
</head>
<body>

  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <div class="container" id="main-container">
    <div class="header">
      <h1>Vpisna knjiga Pečke</h1>
      <p>Prosimo, vnesite svoje podatke za vpis obiska.</p>
    </div>

    <div id="status-box"></div>

    <form id="vpis-form" action="https://script.google.com/macros/s/AKfycbwcCak3L6C3m_yO2-fT9p7j8fCgS2k49c1A3X1k7y2K5P0g9L3a1N0b/exec" method="POST" target="hidden_iframe">
      <div class="form-group">
        <label for="ime">Ime</label>
        <input type="text" id="ime" name="ime" required autocomplete="given-name">
      </div>

      <div class="form-group">
        <label for="priimek">Priimek</label>
        <input type="text" id="priimek" name="priimek" required autocomplete="family-name">
      </div>

      <div class="form-group">
        <label for="email">E-poštni naslov</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>Način vzpona</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="pes" name="nacin" value="Peš" checked>
            <label for="pes">Peš</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="kolo" name="nacin" value="Kolo">
            <label for="kolo">Kolo</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="ekolo" name="nacin" value="eKolo">
            <label for="ekolo">eKolo</label>
          </div>
        </div>
      </div>

      <input type="hidden" id="lat" name="lat">
      <input type="hidden" id="lng" name="lng">

      <button type="submit" id="submit-btn" disabled>Pridobivanje GPS lokacije...</button>
    </form>

    <div class="footer">
      <p>Vpis je mogoč le v neposredni bližini Pečk (do 50 m).</p>
    </div>
  </div>

  <script>
    const TARGET_LAT = 46.52271285660147;
    const TARGET_LNG = 15.54089586436217;
    const MAX_RADIUS_METERS = 50;

    const container = document.getElementById('main-container');
    const form = document.getElementById('vpis-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    const latInput = document.getElementById('lat');
    const lngInput = document.getElementById('lng');
    const iframe = document.getElementById('hidden_iframe');

    let isSubmitting = false;
    let currentDistance = null;

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function showStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = '';
      statusBox.classList.add('status-' + type);
      statusBox.style.display = 'block';
    }

    function checkLocation() {
      if (!navigator.geolocation) {
        showStatus("Vaš brskalnik ne podpira geolokacije.", "error");
        submitBtn.textContent = "Geolokacija ni podprta";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          latInput.value = userLat;
          lngInput.value = userLng;

          currentDistance = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

          if (currentDistance <= MAX_RADIUS_METERS) {
            showStatus(`Nahajate se v območju vpisa (${currentDistance} m od točke).`, "success");
            submitBtn.disabled = false;
            submitBtn.textContent = "Zabeleži vpis";
          } else {
            showStatus(`Predaleč ste! Nahajate se ${currentDistance} m od točke (dovoljeno do ${MAX_RADIUS_METERS} m).`, "error");
            submitBtn.disabled = true;
            submitBtn.textContent = "Vpis ni mogoč (prevelika razdalja)";
          }
        },
        (error) => {
          let errorMsg = "Napaka pri pridobivanjem lokacije.";
          if (error.code === error.PERMISSION_DENIED) {
            errorMsg = "Dostop do GPS lokacije je zavrnjen. Prosimo, omogočite lokacijo v brskalniku.";
          }
          showStatus(errorMsg, "error");
          submitBtn.textContent = "Omogočite GPS lokacijo";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    form.addEventListener('submit', function(e) {
      submitBtn.disabled = true;
      submitBtn.textContent = "Pošiljanje...";
      isSubmitting = true;
    });

    iframe.addEventListener('load', function() {
      if (isSubmitting) {
        const imeVal = document.getElementById('ime').value;
        const priimekVal = document.getElementById('priimek').value;
        const nacinVal = document.querySelector('input[name="nacin"]:checked').value;

        container.innerHTML = `
          <div class="success-card">
            <div class="icon">✓</div>
            <h2>Vpis uspešen!</h2>
            <p>Hvala, <strong>${imeVal} ${priimekVal}</strong>.<br>Vaš obisk je bil uspešno zabeležen (način: ${nacinVal}, oddaljenost: ${currentDistance} m).</p>
            <a href="https://sandimobilno.github.io/Pecke-Vpis/" class="btn">Nazaj na vpis</a>
          </div>
        `;
        isSubmitting = false;
      }
    });

    window.onload = checkLocation;
  </script>
</body>
</html>
