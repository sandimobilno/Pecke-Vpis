<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izziv Pečke - vpis vzpona</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --primary-hover: #1b5e20;
      --accent-color: #4caf50;
      --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #607d8b;
      --border-color: #e0e0e0;
      --error-bg: #ffebee;
      --error-text: #c62828;
      --error-border: #ef9a9a;
      --success-bg: #e8f5e9;
      --success-text: #2e7d32;
      --success-border: #a5d6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px 20px 20px 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 20px 28px 24px 28px;
      width: 100%;
      max-width: 440px;
      margin-top: 10px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      color: var(--primary-color);
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 0;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label.section-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      background-color: #fafafa;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      border-color: var(--accent-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
      outline: none;
    }

    .radio-group {
      display: flex;
      gap: 8px;
    }

    .radio-option {
      flex: 1;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 11px 8px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      background-color: #fafafa;
      transition: all 0.2s ease;
    }

    .radio-option input:checked + label {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.25);
    }

    #status-box {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
      display: none;
      line-height: 1.4;
    }

    .status-error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .status-success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    button, .btn {
      display: inline-block;
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled), .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      background-color: #b0bec5;
      box-shadow: none;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .copyright {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.8;
    }

    .success-card {
      text-align: center;
      padding: 10px 0;
    }

    .success-card .icon {
      font-size: 54px;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .success-card h2 {
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .success-card p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
      color: var(--text-main);
    }

    iframe#hidden_iframe {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Skrito iframe okno za preprečitev preusmeritve -->
  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <div class="container" id="main-container">
    <div class="header">
      <h1>Izziv Pečke - vpis vzpona</h1>
    </div>

    <div id="status-box"></div>

    <form id="vpis-form" action="https://script.google.com/macros/s/AKfycbwcCak3L6C3m_yO2-fT9p7j8fCgS2k49c1A3X1k7y2K5P0g9L3a1N0b/exec" method="POST" target="hidden_iframe">
      <div class="form-group">
        <input type="text" id="ime" name="ime" placeholder="Ime" required autocomplete="given-name">
      </div>

      <div class="form-group">
        <input type="text" id="priimek" name="priimek" placeholder="Priimek" required autocomplete="family-name">
      </div>

      <div class="form-group">
        <input type="email" id="email" name="email" placeholder="E-poštni naslov" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="section-label">Način vzpona</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="pes" name="nacin" value="Peš" required>
            <label for="pes">Peš</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="kolo" name="nacin" value="Kolo">
            <label for="kolo">Kolo</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="ekolo" name="nacin" value="eKolo">
            <label for="ekolo">eKolo</label>
          </div>
        </div>
      </div>

      <input type="hidden" id="lat" name="lat">
      <input type="hidden" id="lng" name="lng">

      <button type="submit" id="submit-btn" disabled>Pridobivanje GPS lokacije...</button>
    </form>

    <div class="footer">
      <p class="copyright">&copy; Aleksander Brečko</p>
    </div>
  </div>

  <script>
    const TARGET_LAT = 46.52271285660147;
    const TARGET_LNG = 15.54089586436217;
    const MAX_RADIUS_METERS = 50;

    const container = document.getElementById('main-container');
    const form = document.getElementById('vpis-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    const latInput = document.getElementById('lat');
    const lngInput = document.getElementById('lng');
    const iframe = document.getElementById('hidden_iframe');

    let isSubmitting = false;
    let currentDistance = null;

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function showStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = '';
      statusBox.classList.add('status-' + type);
      statusBox.style.display = 'block';
    }

    function checkLocation() {
      if (!navigator.geolocation) {
        showStatus("Vaš brskalnik ne podpira geolokacije.", "error");
        submitBtn.textContent = "Geolokacija ni podprta";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          latInput.value = userLat;
          lngInput.value = userLng;

          currentDistance = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

          if (currentDistance <= MAX_RADIUS_METERS) {
            showStatus(`Nahajate se v območju vpisa (${currentDistance} m od točke).`, "success");
            submitBtn.disabled = false;
            submitBtn.textContent = "Zabeleži vpis";
          } else {
            showStatus(`Predaleč ste! Nahajate se ${currentDistance} m od točke vpisa (dovoljeno je do ${MAX_RADIUS_METERS} m).`, "error");
            submitBtn.disabled = true;
            submitBtn.textContent = "Vpis ni mogoč (prevelika razdalja)";
          }
        },
        (error) => {
          let errorMsg = "Napaka pri pridobivanjem lokacije.";
          if (error.code === error.PERMISSION_DENIED) {
            errorMsg = "Dostop do GPS lokacije je zavrnjen. Prosimo, omogočite lokacijo v brskalniku.";
          }
          showStatus(errorMsg, "error");
          submitBtn.textContent = "Omogočite GPS lokacijo";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    form.addEventListener('submit', function(e) {
      submitBtn.disabled = true;
      submitBtn.textContent = "Pošiljanje...";
      isSubmitting = true;
    });

    iframe.addEventListener('load', function() {
      if (isSubmitting) {
        const imeVal = document.getElementById('ime').value;
        const priimekVal = document.getElementById('priimek').value;
        const nacinElem = document.querySelector('input[name="nacin"]:checked');
        const nacinVal = nacinElem ? nacinElem.value : '';

        container.innerHTML = `
          <div class="success-card">
            <div class="icon">✓</div>
            <h2>Vpis uspešen!</h2>
            <p>Hvala, <strong>${imeVal} ${priimekVal}</strong>.<br>Vaš obisk je bil uspešno zabeležen (način: ${nacinVal}, oddaljenost: ${currentDistance} m).</p>
            <a href="https://sandimobilno.github.io/Pecke-Vpis/" class="btn">Nazaj na vpis</a>
          </div>
        `;
        isSubmitting = false;
      }
    });

    window.onload = checkLocation;
  </script>
</body>
</html>
