<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vpis obiska - Pečke</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 420px; 
      margin: 0 auto; 
      padding: 20px 15px; 
      text-align: center; 
      color: #2c3e50; 
      background-color: #f0f4f8;
    }
    .card { 
      background: #ffffff; 
      padding: 24px 20px; 
      border-radius: 16px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1a252f;
      font-size: 22px;
    }
    input { 
      width: 100%; 
      padding: 13px 15px; 
      margin: 6px 0; 
      font-size: 15px; 
      border: 1.5px solid #dcdfe6; 
      border-radius: 10px; 
      background-color: #fcfcfc;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0056b3;
      background-color: #ffffff;
    }
    
    .nacin-label {
      display: block;
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      text-align: left;
    }
    .nacin-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 15px;
      gap: 8px;
    }
    .nacin-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 600;
      color: #0056b3;
      background-color: #f0f7ff;
      border: 1.5px solid #b8d9ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .nacin-btn:active {
      transform: scale(0.98);
    }
    .nacin-btn.selected {
      background-color: #0056b3;
      color: #ffffff;
      border-color: #0056b3;
      box-shadow: 0 3px 8px rgba(0, 86, 179, 0.25);
    }

    .btn { 
      width: 100%; 
      padding: 15px; 
      margin-top: 10px; 
      font-size: 16px; 
      font-weight: 700; 
      color: #888888; 
      background-color: #e2e8f0; 
      border: none; 
      border-radius: 10px; 
      cursor: not-allowed; 
      transition: all 0.2s ease; 
    }
    /* Aktiven zelen gumb - vidljiv samo ob vseh izpolnjenih pogojih */
    .btn.active { 
      background-color: #28a745; 
      color: #ffffff;
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }
    .btn.active:active {
      transform: scale(0.99);
    }
    
    .btn-secondary { 
      display: block; 
      width: 100%; 
      margin: 12px auto 0 auto; 
      padding: 13px; 
      font-size: 15px; 
      font-weight: 700; 
      color: #0056b3; 
      background-color: #ffffff; 
      border: 1.5px solid #0056b3; 
      border-radius: 10px; 
      text-decoration: none; 
      transition: all 0.2s ease; 
    }
    .btn-secondary:active { 
      background-color: #f0f7ff; 
      transform: scale(0.99);
    }

    #status { 
      margin-top: 18px; 
      font-size: 14px; 
      font-weight: 600; 
      min-height: 20px; 
      line-height: 1.4;
    }
    .edit-link { 
      display: inline-block; 
      margin-top: 14px; 
      font-size: 13px; 
      color: #0056b3; 
      text-decoration: underline; 
      cursor: pointer; 
    }

    .footer-copyright {
      margin-top: 25px;
      font-size: 12px;
      color: #8898aa;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Vpis obiska</h2>
    
    <input type="text" id="ime" placeholder="Ime" oninput="preveriPogoje()" required>
    <input type="text" id="priimek" placeholder="Priimek" oninput="preveriPogoje()" required>
    <input type="email" id="email" placeholder="E-poštni naslov" oninput="preveriPogoje()" required>
    
    <span class="nacin-label">Izberi način vzpona:</span>
    <div class="nacin-container">
      <button type="button" class="nacin-btn" onclick="izberiNacin('Peš', this)">🚶 Peš</button>
      <button type="button" class="nacin-btn" onclick="izberiNacin('Kolo', this)">🚴 Kolo</button>
      <button type="button" class="nacin-btn" onclick="izberiNacin('eKolo', this)">⚡ eKolo</button>
    </div>

    <button id="vpisBtn" class="btn" disabled onclick="oddajVpis()">PREVERJANJE LOKACIJE...</button>
    
    <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pubhtml?gid=1188154452&single=true" target="_blank" class="btn-secondary">LESTVICA</a>

    <div id="status">Pridobivanje GPS lokacije...</div>
    <span class="edit-link" id="resetBtn" style="display:none;" onclick="pobrisiPodatke()">Spremeni moje podatke</span>
  </div>

  <div class="footer-copyright">
    &copy; Aleksander Brečko
  </div>

  <script>
    const TARGET_LAT = 46.52271285660147;
    const TARGET_LNG = 15.54089586436217;
    const MAX_RADIUS_METERS = 5000;

    let userLat = null;
    let userLng = null;
    let isLocationValid = false;
    let izbranNacin = "";

    function izberiNacin(nacin, btnElement) {
      izbranNacin = nacin;
      const gumbi = document.querySelectorAll('.nacin-btn');
      gumbi.forEach(g => g.classList.remove('selected'));
      btnElement.classList.add('selected');
      preveriPogoje();
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function preveriPogoje() {
      const btn = document.getElementById("vpisBtn");
      const ime = document.getElementById("ime").value.trim();
      const priimek = document.getElementById("priimek").value.trim();
      const email = document.getElementById("email").value.trim();

      const soPodatkiVeljavni = ime !== "" && priimek !== "" && validateEmail(email) && izbranNacin !== "";

      if (isLocationValid && soPodatkiVeljavni) {
        btn.disabled = false;
        btn.classList.add("active");
        btn.innerText = "POTRDI VPIS";
      } else {
        btn.disabled = true;
        btn.classList.remove("active");
        if (!isLocationValid) {
          btn.innerText = "LOKACIJA NI USTREZNA";
        } else {
          btn.innerText = "IZPOLNITE VSA POLJA";
        }
      }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.onload = function() {
      const sIme = localStorage.getItem("vpis_ime");
      const sPriimek = localStorage.getItem("vpis_priimek");
      const sEmail = localStorage.getItem("vpis_email");

      if (sIme && sPriimek && sEmail) {
        document.getElementById("ime").value = sIme;
        document.getElementById("priimek").value = sPriimek;
        document.getElementById("email").value = sEmail;
        document.getElementById("resetBtn").style.display = "inline-block";
      }

      preveriGps();
    };

    function preveriGps() {
      const status = document.getElementById("status");

      isLocationValid = false;
      preveriPogoje();

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            const dist = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

            if (dist <= MAX_RADIUS_METERS) {
              status.style.color = "#28a745";
              status.innerText = `Ste na lokaciji (oddaljenost: ${dist} m).`;
              isLocationValid = true;
            } else {
              status.style.color = "#dc3545";
              status.innerText = `Ste zunaj območja (${dist} m od točke, max ${MAX_RADIUS_METERS} m).`;
              isLocationValid = false;
            }
            preveriPogoje();
          },
          (err) => {
            userLat = null;
            userLng = null;
            isLocationValid = false;
            status.style.color = "#dc3545";
            status.innerText = "Za vpis morate vklopiti GPS in dovoliti dostop do lokacije.";
            preveriPogoje();
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 }
        );
      } else {
        status.innerText = "Vaš brskalnik ne podpira geolokacije.";
        isLocationValid = false;
        preveriPogoje();
      }
    }

    function oddajVpis() {
      const ime = document.getElementById("ime").value.trim();
      const priimek = document.getElementById("priimek").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();

      if (!isLocationValid || userLat === null || userLng === null) {
        alert("Vpis ni mogoč! Vaša lokacija ni ustrezna ali pa nimate vklopljenega GPS-a.");
        return;
      }

      if (!ime || !priimek || !email) {
        alert("Prosimo, izpolnite vsa vnosna polja!");
        return;
      }

      if (!validateEmail(email)) {
        alert("Prosimo, vnesite veljaven e-poštni naslov!");
        return;
      }

      if (!izbranNacin) {
        alert("Prosimo, izberite način vzpona (Peš, Kolo ali eKolo)!");
        return;
      }

      const btn = document.getElementById("vpisBtn");
      btn.disabled = true;
      btn.innerText = "POŠILJANJE...";

      localStorage.setItem("vpis_ime", ime);
      localStorage.setItem("vpis_priimek", priimek);
      localStorage.setItem("vpis_email", email);

      const razdalja = Math.round(getDistance(userLat, userLng, TARGET_LAT, TARGET_LNG));

      const latFormatted = Number(userLat).toFixed(4);
      const lngFormatted = Number(userLng).toFixed(4);

      const baseUrl = "https://script.google.com/macros/s/AKfycbxsWJWNSL_119EsMiIOmPV5Fsl1nDgxiyBve9wi6qaMspEPWCelUJS4ZG7acvagHKLK4A/exec";
      const fullUrl = `${baseUrl}?ime=${encodeURIComponent(ime)}&priimek=${encodeURIComponent(priimek)}&email=${encodeURIComponent(email)}&nacin=${encodeURIComponent(izbranNacin)}&lat=${encodeURIComponent(latFormatted)}&lng=${encodeURIComponent(lngFormatted)}&razdalja=${encodeURIComponent(razdalja)}`;

      window.location.href = fullUrl;
    }

    function pobrisiPodatke() {
      if (confirm("Želite izbrisati shranjene podatke s tega telefona?")) {
        localStorage.removeItem("vpis_ime");
        localStorage.removeItem("vpis_priimek");
        localStorage.removeItem("vpis_email");
        document.getElementById("ime").value = "";
        document.getElementById("priimek").value = "";
        document.getElementById("email").value = "";
        
        izbranNacin = "";
        document.querySelectorAll('.nacin-btn').forEach(g => g.classList.remove('selected'));
        
        document.getElementById("resetBtn").style.display = "none";
        preveriPogoje();
      }
    }
  </script>
</body>
</html>
